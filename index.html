<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CareIQ — Community Health Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#07101f}

:root{
  --navy:#07101f; --navy2:#0c1a2e; --navy3:#112240;
  --teal:#00d4b8; --teal2:#00b89e; --tealDim:rgba(0,212,184,0.1);
  --gold:#d4a843; --goldDim:rgba(212,168,67,0.1);
  --rose:#e8526e; --roseDim:rgba(232,82,110,0.08);
  --violet:#8060cc; --violetDim:rgba(128,96,204,0.1);
  --green:#4ade80; --greenDim:rgba(74,222,128,0.1);
  --orange:#f97316; --orangeDim:rgba(249,115,22,0.1);
  --slate:#7a9bbf; --white:#eef2f8;
  --border:rgba(0,212,184,0.14); --border2:rgba(255,255,255,0.06);
  --glass:rgba(255,255,255,0.04); --glass2:rgba(255,255,255,0.07);
}

.hos{display:flex;flex-direction:column;height:100vh;font-family:'Outfit',sans-serif;color:#eef2f8;background:#07101f;position:relative;overflow:hidden;max-width:480px;margin:0 auto}
.hos::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 90% 50% at 15% 5%,rgba(0,212,184,0.07) 0%,transparent 55%),
  radial-gradient(ellipse 70% 70% at 85% 85%,rgba(128,96,204,0.07) 0%,transparent 55%)}

/* HEADER */
.hdr{position:relative;z-index:10;flex-shrink:0;padding:14px 18px 12px;background:rgba(7,16,31,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.hdr-top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#00d4b8,#8060cc);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 18px rgba(0,212,184,0.28);flex-shrink:0}
.logo-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:#eef2f8}
.logo-sub{font-family:'DM Mono',monospace;font-size:8px;color:#00d4b8;letter-spacing:.18em;text-transform:uppercase;margin-top:1px}
.hdr-right{text-align:right}
.hdr-patient{font-size:12px;font-weight:600}
.hdr-id{font-family:'DM Mono',monospace;font-size:9px;color:#7a9bbf;margin-top:1px}
.shield-active{display:inline-flex;align-items:center;gap:4px;font-family:'DM Mono',monospace;font-size:8px;color:#4ade80;margin-top:3px}
.pulse{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* MODE BAR */
.mode-bar{display:flex;gap:5px;padding:10px 18px;background:rgba(7,16,31,0.95);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:9;overflow-x:auto;scrollbar-width:none}
.mode-bar::-webkit-scrollbar{display:none}
.mode-btn{flex-shrink:0;padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--glass);color:#7a9bbf;font-size:11px;font-weight:500;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;white-space:nowrap}
.mode-btn.on{background:linear-gradient(135deg,#00d4b8,#00b89e);color:#07101f;font-weight:700;border-color:transparent;box-shadow:0 3px 14px rgba(0,212,184,0.28)}
.mode-btn.shield-on{background:linear-gradient(135deg,#4ade80,#22c55e);color:#07101f;border-color:transparent}

/* SCORE RING */
.ring-wrap{display:flex;gap:16px;align-items:center;padding:16px 18px 0;flex-shrink:0;position:relative;z-index:5}
.ring-pos{position:relative;width:88px;height:88px;flex-shrink:0}
.ring-svg{transform:rotate(-90deg)}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:#00d4b8;line-height:1}
.ring-lbl{font-size:8px;color:#7a9bbf;text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
.score-info{flex:1}
.score-title{font-size:20px;font-weight:700;margin-bottom:3px}
.score-sub{font-size:11px;color:#7a9bbf;line-height:1.5}
.trend{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-family:'DM Mono',monospace;font-size:10px;color:#00d4b8;background:rgba(0,212,184,.1);padding:4px 10px;border-radius:20px;border:1px solid rgba(0,212,184,.2)}

/* VITALS */
.vitals-row{display:flex;gap:7px;padding:12px 18px 0;overflow-x:auto;scrollbar-width:none;flex-shrink:0;position:relative;z-index:5}
.vitals-row::-webkit-scrollbar{display:none}
.vital{flex-shrink:0;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:10px 12px;min-width:84px}
.vital-icon{font-size:14px;margin-bottom:3px}
.vital-val{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;line-height:1}
.vital-unit{font-size:8px;color:#7a9bbf}
.vital-name{font-size:9px;color:#7a9bbf;margin-top:2px}
.ok{color:#00d4b8}.warn{color:#d4a843}.alert{color:#e8526e}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;position:relative;z-index:5;scrollbar-width:none;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:14px 18px 110px}

/* SECTIONS */
.sec{font-family:'DM Mono',monospace;font-size:9px;color:#00d4b8;text-transform:uppercase;letter-spacing:.18em;margin:16px 0 8px}
.sec:first-child{margin-top:0}

/* CARDS */
.card{background:var(--glass);border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:10px;backdrop-filter:blur(12px)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.card-title{font-size:13px;font-weight:600}

/* BADGES */
.badge{font-family:'DM Mono',monospace;font-size:9px;padding:3px 8px;border-radius:8px}
.b-red{background:rgba(232,82,110,.18);color:#e8526e;border:1px solid rgba(232,82,110,.28)}
.b-gold{background:rgba(212,168,67,.18);color:#d4a843;border:1px solid rgba(212,168,67,.28)}
.b-teal{background:rgba(0,212,184,.14);color:#00d4b8;border:1px solid rgba(0,212,184,.2)}
.b-violet{background:rgba(128,96,204,.18);color:#b090f0;border:1px solid rgba(128,96,204,.28)}
.b-green{background:rgba(74,222,128,.14);color:#4ade80;border:1px solid rgba(74,222,128,.2)}
.b-orange{background:rgba(249,115,22,.18);color:#f97316;border:1px solid rgba(249,115,22,.28)}

/* DOMAIN GRID */
.dom-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dom-item{background:var(--glass2);border:1px solid var(--border);border-radius:14px;padding:13px}
.dom-name{font-size:10px;color:#7a9bbf;margin-bottom:7px}
.dom-bg{height:4px;background:rgba(255,255,255,.07);border-radius:2px;margin-bottom:5px;overflow:hidden}
.dom-fill{height:100%;border-radius:2px}
.dom-score{font-family:'DM Mono',monospace;font-size:17px;font-weight:500}

/* INSIGHTS */
.insight{border-radius:16px;padding:14px;margin-bottom:9px;border-left:3px solid}
.insight.crit{border-color:#e8526e;background:rgba(232,82,110,0.05)}
.insight.watch{border-color:#d4a843;background:rgba(212,168,67,0.05)}
.insight.pos{border-color:#00d4b8;background:rgba(0,212,184,0.05)}
.insight-hdr{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.insight-title{font-size:12px;font-weight:600}
.insight-body{font-size:11px;color:#7a9bbf;line-height:1.6}
.insight-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.insight-cta{font-size:10px;font-weight:600;color:#00d4b8;padding:5px 12px;border:1px solid rgba(0,212,184,.3);border-radius:20px;background:rgba(0,212,184,.07);cursor:pointer}
.insight-conf{font-family:'DM Mono',monospace;font-size:9px;color:#7a9bbf}

/* TIMELINE */
.tl-item{display:flex;gap:12px;margin-bottom:14px}
.tl-col{display:flex;flex-direction:column;align-items:center}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:2px}
.tl-line{width:1px;flex:1;background:rgba(0,212,184,0.14);margin-top:3px}
.tl-body{flex:1;padding-bottom:12px}
.tl-date{font-family:'DM Mono',monospace;font-size:9px;color:#7a9bbf;margin-bottom:2px}
.tl-title{font-size:12px;font-weight:600;margin-bottom:2px}
.tl-text{font-size:11px;color:#7a9bbf;line-height:1.5}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.stat-item{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center}
.stat-val{font-family:'DM Mono',monospace;font-size:16px;font-weight:500}
.stat-lbl{font-size:9px;color:#7a9bbf;margin-top:3px;line-height:1.3}

/* PROGRESS */
.prog-bg{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:4px}
.prog-fill{height:100%;border-radius:3px}

/* ABAR */
.abar-wrap{margin-bottom:10px}
.abar-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.abar-lbl{color:#7a9bbf}
.abar-bg{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.abar-fill{height:100%;border-radius:3px}

/* MEAL */
.meal-card{background:var(--glass2);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:8px}
.meal-time{font-family:'DM Mono',monospace;font-size:9px;color:#00d4b8;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
.meal-name{font-size:13px;font-weight:600;margin-bottom:3px}
.meal-desc{font-size:11px;color:#7a9bbf;line-height:1.5;margin-bottom:7px}
.meal-tags{display:flex;gap:5px;flex-wrap:wrap}
.meal-tag{font-size:9px;padding:2px 7px;border-radius:8px;background:rgba(0,212,184,0.1);color:#00d4b8;border:1px solid rgba(0,212,184,.2)}

/* EXERCISE */
.ex-card{background:var(--glass2);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:8px}
.ex-type{font-family:'DM Mono',monospace;font-size:9px;color:#8060cc;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
.ex-name{font-size:13px;font-weight:600;margin-bottom:3px}
.ex-desc{font-size:11px;color:#7a9bbf;line-height:1.5;margin-bottom:7px}
.ex-tags{display:flex;gap:5px;flex-wrap:wrap}
.ex-tag{font-size:9px;padding:2px 7px;border-radius:8px;background:rgba(128,96,204,0.1);color:#b090f0;border:1px solid rgba(128,96,204,.2)}

/* WEARABLE */
.wear-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px}
.wear-device{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wear-icon{font-size:24px}
.wear-name{font-size:13px;font-weight:600}
.wear-status{font-family:'DM Mono',monospace;font-size:9px;color:#4ade80}
.wear-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.wear-metric{background:var(--glass2);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
.wear-val{font-family:'DM Mono',monospace;font-size:14px;font-weight:500}
.wear-lbl{font-size:9px;color:#7a9bbf;margin-top:2px}

/* GOV */
.gov-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.gov-name{font-size:11px;color:#7a9bbf;flex:1}
.gov-status{font-family:'DM Mono',monospace;font-size:10px}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:100%;padding:12px 18px 0;min-height:0}
.chat-ai-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-shrink:0}
.chat-msgs{flex:1;overflow-y:auto;padding-bottom:8px;scrollbar-width:none;min-height:0}
.chat-msgs::-webkit-scrollbar{display:none}
.bubble{max-width:88%;margin-bottom:12px}
.bubble.user{margin-left:auto}
.bubble-inner{padding:11px 15px;border-radius:18px;font-size:12px;line-height:1.6}
.bubble.ai .bubble-inner{background:rgba(255,255,255,0.07);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble.user .bubble-inner{background:linear-gradient(135deg,#00d4b8,#00b89e);color:#07101f;border-bottom-right-radius:4px;font-weight:500}
.bubble-meta{font-family:'DM Mono',monospace;font-size:9px;color:#7a9bbf;margin-top:3px}
.shield-tag{display:inline-flex;align-items:center;gap:4px;font-family:'DM Mono',monospace;font-size:8px;padding:2px 7px;border-radius:6px;margin-top:4px;background:rgba(74,222,128,.12);color:#4ade80;border:1px solid rgba(74,222,128,.2)}
.tdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#7a9bbf;animation:blink 1.2s infinite;margin:0 1px}
.tdot:nth-child(2){animation-delay:.2s}.tdot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.qprompts{display:flex;gap:7px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.qprompts::-webkit-scrollbar{display:none}
.qp{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:10px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--glass);color:#7a9bbf;white-space:nowrap;font-family:'Outfit',sans-serif}
.chat-bottom{border-top:1px solid var(--border);padding:10px 0 0;flex-shrink:0}
.chat-row{display:flex;gap:9px}
.chat-in{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:24px;padding:11px 17px;font-size:12px;color:#eef2f8;font-family:'Outfit',sans-serif;outline:none}
.chat-in::placeholder{color:#7a9bbf}
.chat-in:focus{border-color:rgba(0,212,184,.4)}
.chat-send{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#00d4b8,#00b89e);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;box-shadow:0 4px 14px rgba(0,212,184,.28)}

/* SHIELD */
.shield-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.shield-stat-item{background:var(--glass);border:1px solid rgba(74,222,128,0.2);border-radius:14px;padding:12px 8px;text-align:center}
.shield-stat-val{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:#4ade80}
.shield-stat-lbl{font-size:9px;color:#7a9bbf;margin-top:3px;line-height:1.3}
.log-item{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:8px}
.log-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.log-time{font-family:'DM Mono',monospace;font-size:9px;color:#7a9bbf}
.risk-meter{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-top:6px}
.risk-fill{height:100%;border-radius:3px}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;background:rgba(7,16,31,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:7px 0 14px}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;cursor:pointer;border:none;background:none;color:#7a9bbf;transition:color .2s}
.bnav-btn.on{color:#00d4b8}
.bnav-btn.shield-nav.on{color:#4ade80}
.bnav-icon{font-size:18px}
.bnav-lbl{font-size:8px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em}

/* ELDER MODE */
body.elder .vital-val{font-size:18px!important}
body.elder .vital-name{font-size:11px!important}
body.elder .insight-body,.elder .tl-text,.elder .meal-desc,.elder .ex-desc{font-size:13px!important}
body.elder .card-title,.elder .insight-title{font-size:15px!important}
body.elder .bnav-lbl{font-size:10px!important}
body.elder .bnav-icon{font-size:22px!important}
body.elder .dom-name{font-size:12px!important}
body.elder .sec{font-size:11px!important}

/* CLINICAL TABLE */
.clin-table{width:100%;border-collapse:collapse}
.clin-table th{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:#7a9bbf;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.clin-table td{padding:10px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px;vertical-align:middle}
.clin-table tr:hover td{background:rgba(0,212,184,0.03);cursor:pointer}
.pt-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;flex-shrink:0}
.sbar-row{display:flex;align-items:center;gap:6px}
.sbar{flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.sbar-fill{height:100%;border-radius:2px}
.sbar-val{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;width:24px;text-align:right}
</style>
</head>
<body>
<div class="hos" id="app">

  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-top">
      <div class="logo">
        <div class="logo-mark">⊕</div>
        <div>
          <div class="logo-name">CareIQ</div>
          <div class="logo-sub">Community Health Intelligence</div>
        </div>
      </div>
      <div class="hdr-right">
        <div class="hdr-patient" id="hdrPatient">Jamie Rivera</div>
        <div class="hdr-id" id="hdrId">CIQ-2026-00241</div>
        <div class="shield-active"><div class="pulse"></div>SHIELD ON</div>
      </div>
    </div>
  </div>

  <!-- SCORE RING (patient mode only) -->
  <div id="ringSection">
    <div class="ring-wrap">
      <div class="ring-pos">
        <svg width="88" height="88" viewBox="0 0 88 88" class="ring-svg">
          <circle cx="44" cy="44" r="37" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7"/>
          <circle cx="44" cy="44" r="37" fill="none" stroke="url(#rg)" stroke-width="7"
            stroke-linecap="round" id="ringArc"
            stroke-dasharray="232.5" stroke-dashoffset="69.75"/>
          <defs>
            <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#00d4b8"/>
              <stop offset="100%" stop-color="#8060cc"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="ring-inner">
          <div class="ring-num" id="ringNum">70</div>
          <div class="ring-lbl">Score</div>
        </div>
      </div>
      <div class="score-info">
        <div class="score-title" id="riskTitle">Moderate Risk</div>
        <div class="score-sub" id="riskSub">2 active gaps · Next visit 45 days</div>
        <div class="trend" id="riskTrend">↑ +6.2% since last visit</div>
      </div>
    </div>
    <div class="vitals-row" id="vitalsRow"></div>
  </div>

  <!-- MODE BAR -->
  <div class="mode-bar">
    <button class="mode-btn on" id="btnPatient" onclick="setMode('patient')">👤 Patient</button>
    <button class="mode-btn" id="btnClinical" onclick="setMode('clinical')">⚕ Clinical</button>
    <button class="mode-btn" id="btnElder" onclick="toggleElder()">👴 Elder Mode</button>
    <button class="mode-btn" id="btnShield" onclick="showShield()">🔒 Shield</button>
  </div>

  <!-- SCROLL CONTENT -->
  <div class="scroll">
    <div id="pageContent"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bnav" id="bnav"></div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const PATIENT = {name:"Jamie Rivera", id:"CIQ-2026-00241", age:54, score:70, fqhc:"Riverside Community Health Center"};

const PATIENTS = [
  {n:'Maria T.',id:'CIQ-00124',age:58,cond:'T2 Diabetes, HTN',risk:'high',rs:87,hs:54,gaps:4,ab:'rgba(232,82,110,.2)',ac:'#e8526e'},
  {n:'James R.',id:'CIQ-00512',age:44,cond:'Pre-Diabetes, Obesity',risk:'medium',rs:61,hs:63,gaps:4,ab:'rgba(212,168,67,.2)',ac:'#d4a843'},

// ── HELPERS ───────────────────────────────────────────────────────────────────
function domC(s){return s>=80?'#00d4b8':s>=60?'#d4a843':'#e8526e';}
function riskC(r){return r==='high'?'#e8526e':r==='medium'?'#d4a843':'#00d4b8';}
function riskB(r){return r==='high'?'b-red':r==='medium'?'b-gold':'b-teal';}

function shieldHash(term){
  let h=0xCF4F2B8A;
  for(let i=0;i<term.length;i++){h=Math.imul(h^term.charCodeAt(i),0x9E3779B9);h^=h>>>16;}
  return(h>>>0).toString(16).padStart(8,'0').toUpperCase();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderPage(){
  const el = document.getElementById('pageContent');
  if(mode==='patient'){
    switch(page){
      case 'health': el.innerHTML=pageHealth(); break;
      case 'insights': el.innerHTML=pageInsights(); break;
      case 'nutrition': el.innerHTML=pageNutrition(); break;
      case 'ai': el.innerHTML=pageAI(); scrollChatToBottom(); break;
      case 'profile': el.innerHTML=pageProfile(); break;
    }
  } else {
    switch(page){
      case 'panel': el.innerHTML=pageClinicalPanel(); break;
      case 'gaps': el.innerHTML=pageClinicalGaps(); break;
      case 'blood': el.innerHTML=pageClinicalBlood(); break;
      case 'impact': el.innerHTML=pageClinicalImpact(); break;
      case 'shield': el.innerHTML=pageClinicalShield(); break;
    }
  }
}

function renderNav(){
  const nav = mode==='patient'?PATIENT_NAV:CLINICAL_NAV;
  document.getElementById('bnav').innerHTML=nav.map(n=>`
    <button class="bnav-btn ${n.id==='shield'?'shield-nav':''} ${page===n.id?'on':''}" onclick="setPage('${n.id}')">
      <span class="bnav-icon">${n.icon}</span>
      <span class="bnav-lbl">${n.label}</span>
    </button>`).join('');
}

function renderRing(){
  const show = mode==='patient' && page!=='ai' && page!=='profile';
  document.getElementById('ringSection').style.display = show?'':'none';
}

function setMode(m){
  mode=m;
  page=m==='patient'?'health':'panel';
  document.getElementById('btnPatient').className='mode-btn'+(m==='patient'?' on':'');
  document.getElementById('btnClinical').className='mode-btn'+(m==='clinical'?' on':'');
  renderNav();renderPage();renderRing();
}

function setPage(p){
  page=p;
  renderNav();renderPage();renderRing();
}

function showShield(){
  setMode('clinical');setPage('shield');
  document.getElementById('btnShield').className='mode-btn shield-on';
}

function toggleElder(){
  elderMode=!elderMode;
  document.body.classList.toggle('elder',elderMode);
  document.getElementById('btnElder').className='mode-btn'+(elderMode?' shield-on':'');
}

// ── CHAT ──────────────────────────────────────────────────────────────────────
function scrollChatToBottom(){
  setTimeout(()=>{
    const el=document.getElementById('chatMsgs');
    if(el) el.scrollTop=el.scrollHeight;
  },100);
}

async function sendChat(text){
  const input=document.getElementById('chatInput');
  const msg=(text||input?.value||'').trim();
  if(!msg) return;
  if(input) input.value='';

  chatMsgs.push({role:'user',text:msg});
  shieldLogs.push({timestamp:new Date().toISOString(),query:msg});

  chatMsgs.push({role:'ai',text:'...'});
  renderPage();scrollChatToBottom();

  try{
    const responses={
      'my ldl risk':'Your LDL of 198 mg/dL is above the optimal range of under 100. For your cardiovascular risk profile, CareIQ recommends discussing statin therapy with your provider and starting a Mediterranean-style diet. Every 10 mg/dL reduction in LDL reduces heart attack risk by about 20%.',
      'prediabetes plan':'Your A1C of 6.1% places you in the prediabetes range. The good news — you are in the best intervention window. The National Diabetes Prevention Program shows 51% of patients at your stage return to normal blood sugar within 14 months. Your plan includes the high-fiber meal protocol, 150 minutes of walking per week, and a 5% body weight reduction target.',
      'exercise for my age':'For your age and health profile, CareIQ recommends 30-minute brisk walks 5 days per week for cardiovascular benefit, chair-based resistance training 3 times per week for muscle mass and insulin sensitivity, and 10 minutes of gentle stretching daily. All exercises are designed to be elder-friendly and safe for your current blood pressure.',
      'what should i eat today':'Today's protocol: Oatmeal Power Bowl for breakfast with berries and walnuts for fiber and antioxidants. Grilled chicken and quinoa for lunch. Baked salmon with dark greens for dinner — the omega-3s directly target your LDL. Limit sodium to under 1,500 mg given your blood pressure.',
      'when is my next visit':'Your next appointment is July 8, 2026 with Dr. Maria Santos. You also have a fasting lab draw scheduled before that visit. CareIQ will remind you 3 days before.',
      'how is my heart health':'Your cardiovascular domain score is 65 out of 100. Your blood pressure at 124/80 is improving but still slightly elevated. Your LDL is the primary concern right now. The good news is your heart rate and SpO2 are both in normal range. Following your current protocol for 90 days should move your cardiovascular score above 75.',
    };
    const key=msg.toLowerCase().replace(/[^a-z0-9 ]/g,'');
    const reply=Object.entries(responses).find(([k])=>key.includes(k.split(' ')[0]))?.[1]||
      `Thank you for that question. Based on your CareIQ health profile, your score of 70 reflects good progress. Your main focus areas are LDL management and prediabetes intervention. Your care team at Riverside Community Health has been notified of this conversation summary. Is there anything specific about your health protocols you would like to understand better?`;

    chatMsgs[chatMsgs.length-1]={role:'ai',text:reply};
  } catch(e){
    chatMsgs[chatMsgs.length-1]={role:'ai',text:'Secure health channel momentarily unavailable. Your data remains protected.'};
  }

  renderPage();scrollChatToBottom();
}
